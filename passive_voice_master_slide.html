<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1">
  <title>Câu 1: Thì hiện tại đơn (bị động)</title>
  <style>
    :root {
      --navy: #0b315f;
      --navy-dark: #082644;
      --beige: #d7c4ae;
      --pale-blue: #b8d6e8;
      --red: #ce5a59;
      --soft-gray: #b8c0c8;
      --answer-blue: #b8efff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    .page {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: #fff;
      color: var(--navy);
      font-family: Arial, Helvetica, sans-serif;
    }

    .element {
      position: absolute;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    .title {
      left: 136px;
      top: 76px;
      width: 1320px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 72px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -1.2px;
    }

    .top-right-decoration {
      left: 1682px;
      top: 84px;
      width: 150px;
      height: 5px;
      background: var(--beige);
    }

    .active-label {
      left: 142px;
      top: 194px;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 400;
      color: var(--navy);
    }

    .sentence-word {
      top: 292px;
      height: 72px;
      font-size: 56px;
      line-height: 1.15;
      font-weight: 400;
      color: var(--navy);
    }

    .sentence-doctors { left: 170px; width: 250px; }
    .sentence-often { left: 486px; width: 220px; }
    .sentence-check { left: 764px; width: 210px; }
    .sentence-object { left: 1035px; width: 710px; }

    .underline {
      top: 363px;
      height: 7px;
      border-radius: 4px;
    }

    .subject-underline { left: 170px; width: 245px; background: var(--red); }
    .verb-underline { left: 764px; width: 196px; background: var(--pale-blue); }
    .object-underline { left: 1035px; width: 678px; background: var(--beige); }

    .svo-label {
      top: 401px;
      height: 60px;
      font-size: 48px;
      line-height: 1.1;
      font-weight: 400;
      color: var(--navy);
    }

    .s-label { left: 284px; width: 60px; text-align: center; }
    .v-label { left: 834px; width: 60px; text-align: center; }
    .o-label { left: 1310px; width: 60px; text-align: center; }

    .conversion-title {
      top: 563px;
      font-size: 34px;
      line-height: 1.1;
      font-style: italic;
      font-weight: 400;
      color: var(--navy);
    }

    .object-title { left: 194px; width: 270px; }
    .passive-object-title { left: 1205px; width: 390px; }

    .conversion-text {
      top: 627px;
      font-size: 40px;
      line-height: 1.15;
      font-weight: 400;
      color: var(--navy);
    }

    .object-text { left: 194px; width: 600px; }
    .passive-object-text { left: 1205px; width: 600px; }

    .transform-arrow {
      left: 865px;
      top: 602px;
      width: 190px;
      height: 70px;
      font-size: 66px;
      line-height: 1;
      font-weight: 300;
      color: var(--soft-gray);
      text-align: center;
    }

    .rule {
      left: 150px;
      font-size: 27px;
      line-height: 1.2;
      font-weight: 400;
      color: var(--navy);
    }

    .rule-singular { top: 770px; }
    .rule-verb { top: 815px; }

    .final-answer-bar {
      left: 672px;
      top: 900px;
      width: 1120px;
      height: 112px;
      background: var(--navy-dark);
      border-radius: 0;
    }

    .final-answer-text {
      left: 730px;
      top: 929px;
      width: 1000px;
      height: 58px;
      font-size: 42px;
      line-height: 1.2;
      font-weight: 400;
      color: var(--answer-blue);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="page" data-document-role="page" data-label="Câu 1: Thì hiện tại đơn (bị động)">
    <div class="element title" data-label="TITLE">Câu 1: Thì hiện tại đơn (bị động)</div>
    <div class="element top-right-decoration" data-label="TOP_RIGHT_DECORATION" aria-hidden="true"></div>
    <div class="element active-label" data-label="ACTIVE_LABEL">Câu chủ động:</div>

    <div class="element sentence-word sentence-doctors" data-label="ACTIVE_SENTENCE_DOCTORS">Doctors</div>
    <div class="element sentence-word sentence-often" data-label="ACTIVE_SENTENCE_OFTEN">often</div>
    <div class="element sentence-word sentence-check" data-label="ACTIVE_SENTENCE_CHECK">check</div>
    <div class="element sentence-word sentence-object" data-label="ACTIVE_SENTENCE_OBJECT">patients' blood pressure</div>

    <div class="element underline subject-underline" data-label="SUBJECT_UNDERLINE" aria-hidden="true"></div>
    <div class="element underline verb-underline" data-label="VERB_UNDERLINE" aria-hidden="true"></div>
    <div class="element underline object-underline" data-label="OBJECT_UNDERLINE" aria-hidden="true"></div>

    <div class="element svo-label s-label" data-label="S_LABEL">S</div>
    <div class="element svo-label v-label" data-label="V_LABEL">V</div>
    <div class="element svo-label o-label" data-label="O_LABEL">O</div>

    <div class="element conversion-title object-title" data-label="OBJECT_TITLE">Object</div>
    <div class="element conversion-text object-text" data-label="OBJECT_TEXT">patients' blood pressure</div>
    <div class="element transform-arrow" data-label="TRANSFORM_ARROW" aria-label="Object to Passive Object">→</div>
    <div class="element conversion-title passive-object-title" data-label="PASSIVE_OBJECT_TITLE">Passive Object</div>
    <div class="element conversion-text passive-object-text" data-label="PASSIVE_OBJECT_TEXT">Patients’ blood pressure</div>

    <div class="element rule rule-singular" data-label="RULE_SINGULAR">singular → is</div>
    <div class="element rule rule-verb" data-label="RULE_VERB">check → checked</div>

    <div class="element final-answer-bar" data-label="FINAL_ANSWER_BAR" aria-hidden="true"></div>
    <div class="element final-answer-text" data-label="FINAL_ANSWER_TEXT">✓ Patients' blood pressure is often checked by doctors.</div>
  </main>
</body>
</html>
